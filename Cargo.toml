[package]
name = "ft-measure"
version = "1.0.0"
edition = "2021"
description = "Record VRChat face tracking values per expression from OSC and write them to a JSON Lines file"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rosc = "0.11"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "accesskit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
