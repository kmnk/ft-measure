# Windows の exe を作り、zip にする。
# Actions の無料枠を使い過ぎないよう、tag の push と手で動かしたときだけ動く。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Package
        id: package
        shell: pwsh
        run: |
          # The version is the tag without "v"; when run by hand, the version in Cargo.toml.
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $dir = "ft-measure-$version"
          $zip = "ft-measure-$version-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/ft-measure.exe, README.md, LICENSE-MIT, LICENSE-APACHE -Destination $dir
          # The Japanese manual (docs/manual-ja/README.md) as offline HTML
          deno run --allow-read --allow-write scripts/manual-html.ts docs/manual-ja "$dir/manual-ja"
          if ($LASTEXITCODE -ne 0) { throw "manual-html failed" }
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Check no VC runtime dependency
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found; cannot check the VC runtime dependency" }
          $deps = & $dumpbin.FullName /dependents target/release/ft-measure.exe
          $deps
          if ($deps -match "VCRUNTIME") { throw "ft-measure.exe depends on the VC runtime" }
      - uses: actions/upload-artifact@v6
        with:
          name: ft-measure-windows-x64
          path: ${{ steps.package.outputs.zip }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.zip }}
